name: MariaDB 12.3

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: Resolve the latest stable MariaDB 12.3 release
        type: boolean
        default: true
      artifact_run_id:
        description: Reuse an existing run's validated artifact to retry publication only
        type: string
        required: false
  schedule:
    - cron: '17 5 1 * *'
      timezone: Asia/Seoul
  push:
    branches: [main]
    paths:
      - .github/workflows/mariadb.yml
      - Dockerfile
      - .dockerignore
      - mariadb/**
      - scripts/update-upstream.py
      - scripts/check-release.py

permissions:
  contents: read

concurrency:
  group: mariadb-build-release
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !inputs.artifact_run_id }}
    name: MariaDB 12.3 / cedarview
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CONTAINER: synology-mariadb-build
      MARIADB_SERIES: '12.3'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the latest stable MariaDB 12.3 release
        if: github.event_name == 'schedule' || inputs.refresh == true
        run: python3 scripts/update-upstream.py mariadb --mariadb-series "$MARIADB_SERIES"
      - name: Read the selected version
        run: |
          eval "$(python3 mariadb/config.py)"
          [[ "$MARIADB_VERSION" == "$MARIADB_SERIES".* ]]
          echo "MARIADB_VERSION=$MARIADB_VERSION" >> "$GITHUB_ENV"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
      - name: Skip versions already published
        id: release
        run: python3 scripts/check-release.py "$RELEASE_TAG"
      - name: Download locked sources
        if: steps.release.outputs.build == 'true'
        run: python3 mariadb/fetch-inputs.py
      - name: Prepare the Linux builder
        if: steps.release.outputs.build == 'true'
        run: |
          docker build -t synology-mariadb-builder:local .
          docker run -d --name "$CONTAINER" --cpus=2 --memory=6g \
            -e BUILD_JOBS=2 -e BUILD_COMMIT="$GITHUB_SHA" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/mariadb,target=/work" \
            --mount type=volume,source=synology-mariadb-build,target=/build \
            synology-mariadb-builder:local sleep infinity
      - name: Compile with the DSM 7.1 cedarview toolchain
        if: steps.release.outputs.build == 'true'
        run: docker exec "$CONTAINER" bash /work/build-linux.sh
      - name: Audit and test the staged server
        if: steps.release.outputs.build == 'true'
        run: docker exec "$CONTAINER" python3 /work/verify-build.py
      - name: Package and test the extracted release
        if: steps.release.outputs.build == 'true'
        run: docker exec "$CONTAINER" bash /work/package-linux.sh
      - name: Build and verify the SPK
        if: steps.release.outputs.build == 'true'
        run: |
          sudo env GITHUB_SHA="$GITHUB_SHA" python3 mariadb/package-spk.py --runtime "mariadb/dist/$ARCHIVE" --output mariadb/dist
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin mariadb
          sudo python3 mariadb/verify-spk.py --spk "mariadb/dist/MariaDB-cedarview-$MARIADB_VERSION-0001.spk" \
            --output mariadb/build/spk-validation.json
      - name: Save release artifacts
        if: steps.release.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MariaDB-cedarview-DSM7.1
          path: |
            mariadb/dist/*
            mariadb/build/validation.json
            mariadb/build/final-validation.json
            mariadb/build/spk-validation.json
          if-no-files-found: error
          retention-days: 30
      - name: Save build logs
        if: always() && steps.release.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MariaDB-cedarview-build-logs
          path: |
            mariadb/build/*.log
            mariadb/build/status.txt
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish MariaDB
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || inputs.artifact_run_id != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN_ID: ${{ inputs.artifact_run_id || github.run_id }}
      MARIADB_SERIES: '12.3'
    steps:
      - name: Select the build artifact
        id: artifact
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > run.json
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg current "$GITHUB_RUN_ID" '
            .head_branch == "main" and .head_repository.full_name == $repo and
            .path == ".github/workflows/mariadb.yml" and
            (.event == "push" or .event == "workflow_dispatch" or .event == "schedule") and
            ((.id | tostring) == $current or .status == "completed")
          ' run.json
          echo "BUILD_SHA=$(jq -r .head_sha run.json)" >> "$GITHUB_ENV"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.expired == false) | .name' > artifacts.txt
          if ! grep -Fxq MariaDB-cedarview-DSM7.1 artifacts.txt; then
            if [[ "$BUILD_RUN_ID" != "$GITHUB_RUN_ID" ]]; then
              echo 'The selected run has no available validated artifact' >&2
              exit 1
            fi
            echo 'No new MariaDB release to publish'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name MariaDB-cedarview-DSM7.1 --dir release
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Check the artifact and publish
        if: steps.artifact.outputs.ready == 'true'
        working-directory: release/dist
        run: |
          mapfile -t archives < <(find . -maxdepth 1 -type f -name '*.tar.gz')
          [[ ${#archives[@]} == 1 ]]
          archive=${archives[0]#./}
          version=$(jq -er .version "$archive.manifest.json")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$archive" == "mariadb-$version-cedarview-0001.tar.gz" ]]
          tag="mariadb-$version-0001"
          sha256sum --check --strict "$archive.sha256"
          digest=$(sha256sum "$archive" | cut -d ' ' -f 1)
          jq -e --arg version "$version" --arg series "$MARIADB_SERIES" --arg digest "$digest" --arg sha "$BUILD_SHA" --arg tag "$tag" '
            .version == $version and .sha256 == $digest and .build_commit == $sha and
            (.version | startswith($series + ".")) and
            .release_tag == $tag and .architecture == "cedarview" and .glibc == "2.26" and
            .physical_nas_tested == false
          ' "$archive.manifest.json"
          for report in ../build/validation.json ../build/final-validation.json; do
            jq -e --arg version "$version" '
              .ok == true and .version == $version and .physical_nas_tested == false and
              .smoke.innodb_crud == true and .smoke.transaction_rollback == true and
              .smoke.prepared_statement == true and .smoke.korean_emoji == true
            ' "$report"
          done
          spk="MariaDB-cedarview-$version-0001.spk"
          sha256sum --check --strict "$spk.sha256"
          jq -e '.ok == true and .upgrade_preserves_data == true' ../build/spk-validation.json
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/existing.json" 2>/dev/null; then
            jq -e --arg archive "$archive" --arg digest "sha256:$digest" '
              .draft == false and any(.assets[]; .name == $archive and .digest == $digest and .state == "uploaded")
            ' "$RUNNER_TEMP/existing.json"
            echo "$tag already published with this artifact"
            exit 0
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > "$RUNNER_TEMP/tag.json" 2>/dev/null; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$BUILD_SHA" > /dev/null
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > "$RUNNER_TEMP/tag.json"
          fi
          jq -e --arg sha "$BUILD_SHA" '.object.type == "commit" and .object.sha == $sha' "$RUNNER_TEMP/tag.json"
          printf 'MariaDB %s\n\nBuild: DSM 7.1 / cedarview / GCC 8.5.0 / glibc 2.26\n' "$version" \
            > "$RUNNER_TEMP/mariadb-release-notes.md"
          gh release create "$tag" "$archive" "$archive.sha256" "$spk" "$spk.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "MariaDB $version / DSM 7.1 cedarview" \
            --notes-file "$RUNNER_TEMP/mariadb-release-notes.md" --draft
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
