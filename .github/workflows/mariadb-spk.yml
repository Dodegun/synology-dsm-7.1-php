name: MariaDB SPK

on:
  workflow_dispatch:
    inputs:
      runtime_tag:
        description: Existing MariaDB runtime release
        type: string
        required: true
        default: mariadb-13.0.2-0001

permissions:
  contents: write

concurrency:
  group: mariadb-build-release
  cancel-in-progress: false

jobs:
  package:
    name: Package MariaDB SPK
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RUNTIME_TAG: ${{ inputs.runtime_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the existing runtime
        run: |
          [[ "$RUNTIME_TAG" =~ ^mariadb-([0-9]+\.[0-9]+\.[0-9]+)-0001$ ]]
          version=${BASH_REMATCH[1]}
          echo "MARIADB_VERSION=$version" >> "$GITHUB_ENV"
          gh release download "$RUNTIME_TAG" --repo "$GITHUB_REPOSITORY" --dir runtime \
            --pattern "mariadb-$version-cedarview-0001.tar.gz*"
          (cd runtime && sha256sum --check --strict "mariadb-$version-cedarview-0001.tar.gz.sha256")
      - name: Package the SPK
        run: |
          python3 mariadb/package-spk.py \
            --runtime "runtime/mariadb-$MARIADB_VERSION-cedarview-0001.tar.gz" --output dist
      - name: Verify package lifecycle
        run: |
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin mariadbcustom
          sudo python3 mariadb/verify-spk.py \
            --spk "dist/MariaDBCustom-cedarview-$MARIADB_VERSION-0001.spk" --output dist/spk-validation.json
      - name: Save the SPK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MariaDB-SPK-cedarview-DSM7.1
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload SPK to the existing release
        run: |
          (cd dist && sha256sum --check --strict "MariaDBCustom-cedarview-$MARIADB_VERSION-0001.spk.sha256")
          gh release upload "$RUNTIME_TAG" dist/*.spk dist/*.spk.sha256 dist/*.spk.manifest.json \
            dist/spk-validation.json --repo "$GITHUB_REPOSITORY"
